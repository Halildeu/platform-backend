# application-k8s.yml — user-service (platform-k8s-gitops uyumlu)
# D7 Eureka kaldırıldı, D18 management port 8081, D19 host Service+Endpoints

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  cloud:
    vault:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/serban}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/serban/protocol/openid-connect/certs}

# gitops#3211 — panel MFA section proxy. Narrow KC admin surface via the
# dedicated user-mfa-admin confidential client (realm-management view-users
# + manage-users only). Blank secret keeps the surface disabled fail-closed
# (503) — prod stays off until owner-gated provisioning.
keycloak:
  admin-api:
    base-url: ${KEYCLOAK_ADMIN_API_BASE_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_ADMIN_API_REALM:platform-test}
    client-id: ${KEYCLOAK_ADMIN_API_CLIENT_ID:user-mfa-admin}
    client-secret: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET:}
    timeout-millis: ${KEYCLOAK_ADMIN_API_TIMEOUT_MILLIS:5000}

server:
  port: ${SERVER_PORT:8089}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSSXXX}","level":"%p","trace_id":"%X{traceId:-}","span_id":"%X{spanId:-}","thread":"%t","logger":"%logger{36}","message":"%m"}%n'
