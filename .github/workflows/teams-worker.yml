name: Teams worker tests and package

on:
  push:
    branches: [main]
    paths:
      - 'teams-capture-worker/**'
      - '.github/workflows/teams-worker.yml'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact main commit to test and publish; no runtime deployment'
        required: true
        type: string
  pull_request:
    paths:
      - 'teams-capture-worker/**'
      - '.github/workflows/teams-worker.yml'

permissions:
  contents: read

concurrency:
  group: teams-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check manual publication source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Teams manifest template and icons
        run: node --test teams-capture-worker/teams-app-manifest/*.test.mjs teams-capture-worker/scripts/*.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run worker tests
        run: dotnet test teams-capture-worker/tests/TeamsCapture.Worker.Tests/TeamsCapture.Worker.Tests.csproj --configuration Release --logger trx --results-directory test-results
      - name: Package worker
        run: dotnet publish teams-capture-worker/src/TeamsCapture.Worker/TeamsCapture.Worker.csproj --configuration Release --no-restore --output worker-package
      - name: Record source and hashes
        shell: bash
        run: |
          git rev-parse HEAD > worker-package/SOURCE_COMMIT
          find worker-package -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > worker-package/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: teams-worker-${{ github.sha }}
          path: worker-package/
          if-no-files-found: error
          retention-days: 7

      - name: Build disabled worker image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" --tag "teams-worker-ci:$SOURCE_COMMIT" teams-capture-worker
      - name: Smoke container and persistent volume
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir container-package
          node teams-capture-worker/scripts/container-smoke.mjs "teams-worker-ci:$SOURCE_COMMIT" "$SOURCE_COMMIT" container-package/smoke.json
      - name: Archive verified image and source evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker save "teams-worker-ci:$SOURCE_COMMIT" | gzip > container-package/teams-worker-image.tar.gz
          printf '%s\n' "$SOURCE_COMMIT" > container-package/SOURCE_COMMIT
          cd container-package
          sha256sum SOURCE_COMMIT smoke.json teams-worker-image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: teams-worker-container-${{ github.sha }}
          path: container-package/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teams-worker-tests-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: teams-worker-container-${{ github.sha }}
          path: container-package
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested archive and verify registry digest
        id: image
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: node teams-capture-worker/scripts/publish-image.mjs "$GITHUB_SHA" container-package registry-image.json
      - name: Attest published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/halildeu/platform-backend-teams-capture-worker
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teams-worker-registry-${{ github.sha }}
          path: registry-image.json
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable image reference
        env:
          VERIFIED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          printf 'Verified Teams image: `%s`\n\nNo runtime deployment or live meeting acceptance.\n' "$VERIFIED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
