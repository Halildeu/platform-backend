# Flyway script-scoped config. The seeded body_text contains the Thymeleaf
# expression [[${vars.code}]], and Flyway's own placeholder syntax is ALSO
# ${...} — without this switch Flyway refuses the script with "No value
# provided for placeholder: ${vars.code}". Scoped to this one migration so
# every other script keeps normal placeholder behaviour.
placeholderReplacement=false
