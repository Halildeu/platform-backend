spring:
  datasource:
    url: jdbc:h2:mem:budget-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SET SCHEMA public
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://issuer.example.test
          jwk-set-uri: http://issuer.example.test/jwks

budget:
  jwt-audience: budget-service
  rls-session-enabled: false
  database-role-guard-enabled: false
